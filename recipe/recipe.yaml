# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.85.1"
  # this upstream pin appears in grpcio_version.py, and has always been the same as `version`
  grpcio_min: ${{ version }}
  # this upstream pin appears in setup.py, not updated w/r/t to code generation version
  protobuf_min: "7.35.1"
  protobuf_max: "8.0.0"
  python_check_max: "3.15"

package:
  name: grpcio-health-checking
  version: ${{ version }}

source:
  - target_directory: dist
    url: https://files.pythonhosted.org/packages/source/g/grpcio-health-checking/grpcio_health_checking-${{ version }}.tar.gz
    sha256: 93a5eeb29262165949b32fdaa86505f11018d1b8161382ee373a85530b11d281
  - target_directory: src
    url: https://github.com/grpc/grpc/archive/v${{ version }}.tar.gz
    sha256: 90d8098ae0b7a1cdbccd2162193bb9d162d64c4e332a89daa4317a49fe92f386

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77.0.1
  run:
    - grpcio >=${{ grpcio_min }}
    - protobuf >=${{ protobuf_min }},<${{ protobuf_max }}
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/grpcio-health-checking/**
      site_packages:
        - grpc_health/**
        - grpcio_health_checking-${{ version }}.dist-info/**
  - python:
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
      imports:
        - grpc_health
        - grpc_health.v1.health
  - files:
      recipe:
        - run_test.py
      source:
        - dist/setup.py
        - dist/grpc_version.py
        # the actual tests to run under coverage
        - src/src/python/grpcio_tests/tests/health_check/**
        - src/src/python/grpcio_tests/tests_aio/health_check/**
        # test imports
        - src/src/python/grpcio_tests/tests/{__init__,_loader,_result,_runner}.py
        - src/src/python/grpcio_tests/tests/unit/__init__.py
        - src/src/python/grpcio_tests/tests/unit/framework/__init__.py
        - src/src/python/grpcio_tests/tests/unit/framework/common/__init__.py
        - src/src/python/grpcio_tests/tests/unit/framework/common/test_constants.py
        - src/src/python/grpcio_tests/tests/unit/test_common.py
        - src/src/python/grpcio_tests/tests/unit/thread_pool.py
        # async imports
        - src/src/python/grpcio_tests/tests_aio/unit/{__init__,_test_base}.py
    requirements:
      run:
        - pytest-cov
        - python ${{ python_min }}.*
    script:
      env:
        PKG_GRPCIO_MIN: ${{ grpcio_min }}
        PKG_PROTOBUF_MIN: ${{ protobuf_min }}
        PKG_PROTOBUF_MAX: ${{ protobuf_max }}
      content:
        - python run_test.py

about:
  summary: Standard Health Checking Service for gRPC
  license: Apache-2.0
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/grpcio-health-checking
  repository: https://github.com/grpc/grpc/tree/master/src/python/grpcio_health_checking
  documentation: https://grpc.github.io/grpc/python/grpc_health_checking.html

extra:
  recipe-maintainers:
    - bollwyvl
